name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.santhoshchokkalingam

 }}
          password: ${{ secrets.santhoshchokkalingam

 }}



      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.santhoshchokkalingam

 }}/node-cicd-app:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.santhoshchokkalingam

 }}/node-cicd-app:latest